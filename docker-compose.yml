services:
  warp-ddns:
    build: .
    container_name: warp-ddns-scanner
    restart: unless-stopped
    env_file:
      - .env
    # 必须使用 host 网络，防止 Docker bridge NAT 的端口映射导致 UDP RTT 延迟测不准
    network_mode: "host" 
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
